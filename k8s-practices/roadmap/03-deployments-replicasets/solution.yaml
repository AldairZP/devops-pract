apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-solution
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-solution
  template:
    metadata:
      labels:
        app: web-solution
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
