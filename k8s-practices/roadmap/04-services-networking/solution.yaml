apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-web
  template:
    metadata:
      labels:
        app: service-web
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: service-web
spec:
  selector:
    app: service-web
  ports:
    - port: 80
      targetPort: 80
