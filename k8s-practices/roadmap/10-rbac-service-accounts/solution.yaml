apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-reader-solution
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader-solution
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-solution
subjects:
  - kind: ServiceAccount
    name: pod-reader-solution
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader-solution
