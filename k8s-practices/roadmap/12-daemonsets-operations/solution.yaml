apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent-solution
spec:
  selector:
    matchLabels:
      app: node-agent-solution
  template:
    metadata:
      labels:
        app: node-agent-solution
    spec:
      containers:
        - name: agent
          image: busybox:1.36
          command: ["sh", "-c", "echo node-agent; sleep 3600"]
