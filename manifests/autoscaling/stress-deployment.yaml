apiVersion: apps/v1
kind: Deployment
metadata:
  name: stress-deploy
  labels:
    app: stress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stress
  template:
    metadata:
      labels:
        app: stress
    spec:
      containers:
        - name: stress
          image: polinux/stress-ng
          args:
            - --cpu
            - "1"
            - --cpu-load
            - "100"
          resources:
            requests:
              cpu: 200m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
