apiVersion: v1
kind: Pod
metadata:
  name: pod-con-configmap
  labels:
    app: config-demo
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: mensaje-vol
          mountPath: /config
          readOnly: true
  volumes:
    - name: mensaje-vol
      configMap:
        name: mensaje-config
