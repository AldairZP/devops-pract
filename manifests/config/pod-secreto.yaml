# Requires the Secret created in the topic README:
#   kubectl create secret generic demo-secret --from-literal=API_KEY=change-me
apiVersion: v1
kind: Pod
metadata:
  name: pod-secreto
  labels:
    app: secret-demo
spec:
  containers:
    - name: alpine
      image: alpine:3.20
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: demo-secret
              key: API_KEY
